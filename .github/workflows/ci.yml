name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm secrets:check
      - run: pnpm build

  emulator-e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_FIREBASE_API_KEY: local-emulator-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-fenoa.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-fenoa
      NEXT_PUBLIC_FIREBASE_APP_ID: local-emulator-app
      NEXT_PUBLIC_USE_FIREBASE_EMULATORS: "true"
      FIREBASE_PROJECT_ID: demo-fenoa
      FENOA_SEED_CREATOR_UID: playwright-user
      NEXT_PUBLIC_NIGHTFALL_BRANCH_ID: nightfall-fragments
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: >-
          pnpm exec firebase emulators:exec --project demo-fenoa --only auth,firestore
          "pnpm seed:nightfall && pnpm test:integration && pnpm seed:nightfall && pnpm test:e2e"
